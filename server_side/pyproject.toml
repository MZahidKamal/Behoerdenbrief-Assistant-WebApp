[project]
name = "server-side"
version = "0.1.0"
description = "Backend of the Behoerdenbrief Assistant: FastAPI API and Celery worker."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# Ruff: linter (`ruff check`) and formatter (`ruff format`). RULES §1.5, MEMORY D-102.
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: standard style
    "W",   # pycodestyle warnings: whitespace
    "F",   # Pyflakes: unused imports, undefined names
    "I",   # isort: sorted imports
    "B",   # flake8-bugbear: common Python traps
    "UP",  # pyupgrade: modern Python syntax
    "S",   # flake8-bandit: security problems
    "D",   # pydocstyle: docstrings everywhere (RULES §3.2)
    "DTZ", # flake8-datetimez: no naive datetimes (RULES §4.5)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# D103: test functions have no docstring (RULES §3.2).
# S101: pytest checks results with `assert`.
"tests/**/*.py" = ["D103", "S101"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# mypy: static type checks in strict mode for `app` and `tests`. RULES §4.6, MEMORY D-103.
[tool.mypy]
python_version = "3.14"
strict = true
# The Pydantic plugin helps mypy understand Pydantic models and settings.
plugins = ["pydantic.mypy"]
# Allure has no type hints. Calls into it are allowed; decorators are not,
# so tests set the story with `allure.dynamic.story(...)` (MEMORY D-104).
untyped_calls_exclude = ["allure", "allure_commons"]

# pytest: finds and runs the tests in `tests/`. RULES §10, ARCHITECTURE §9.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers and unknown settings are errors, so typos are found early.
addopts = ["--strict-markers", "--strict-config"]
# Every `async def` test runs without an extra marker (MEMORY D-104).
asyncio_mode = "auto"
# Each test gets its own event loop, so tests do not affect each other.
asyncio_default_fixture_loop_scope = "function"

# Coverage: how many lines and branches of `app` the tests run. RULES §10.1.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
